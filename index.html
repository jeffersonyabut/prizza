<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prizza</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="sound-intro" id="soundIntro">
      <div class="sound-intro-content">
        <p class="intro-eyebrow">WELCOME TO</p>
        <h2>Prizza.</h2>
        <p class="intro-description">
          A little music makes the experience better.
        </p>

        <div class="sound-buttons" id="soundButtons">
          <button class="sound-btn sound-btn-primary" id="unmuteBtn">
            <span>♫</span> Unmute
          </button>

          <button class="sound-btn sound-btn-secondary" id="muteBtn">
            <span>×</span> Mute
          </button>
        </div>

        <div class="intro-loading" id="introLoading">
          <div class="loading-spinner"></div>
          <p>Preparing your experience...</p>
        </div>
      </div>
    </div>

    <div class="home-container">
      <div class="home-body">
        <h1>Frontend Enthusiast</h1>
        <div class="prof-desc">
          <img
            style="margin-left: 42px"
            class="prof-pic"
            src="1x1.png"
            alt="prof-pic"
            width="240px"
            height="240px"
          />
          <div>
            <h2
              style="
                font-family: Inter;
                color: var(--primary);
                font-size: 32px;
                z-index: 10;
                position: relative;
              "
            >
              Jefferson Yabut
            </h2>
            <div class="p-info">
              <p style="position: relative; z-index: 1">
                Currently exploring UI/UX and frontend development.
              </p>
              <p class="u-line"></p>
            </div>
            <button class="dl_button" onclick="alert('On development')" ;>
              download cv
              <img
                src="/prizza/public/d-Vector.svg"
                alt=""
                height="20"
                width="20"
              />
            </button>
          </div>
        </div>
      </div>

      <div class="flight-path">
        <svg
          viewBox="0 0 600 260"
          xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="xMidYMid meet"
        >
          <path
            id="flightRoute"
            d="M 35 190 C 150 25, 330 20, 555 145"
            fill="none"
            stroke="#f9fafb"
            stroke-width="2"
            stroke-linecap="round"
            stroke-dasharray="4 10"
            pathLength="1000"
            opacity="0.7"
          >
            <animate
              attributeName="stroke-dashoffset"
              values="1000;0;0;1000"
              keyTimes="0;0.85;0.98;1"
              dur="6s"
              repeatCount="indefinite"
            />
          </path>

          <image
            href="/prizza/public/plane-det.svg"
            width="38"
            height="38"
            x="-19"
            y="-19"
          >
            <animateMotion
              dur="6s"
              repeatCount="indefinite"
              rotate="auto"
              path="M 35 190 C 150 25, 330 20, 555 145"
              keyPoints="0;1;1"
              keyTimes="0;0.85;1"
              calcMode="linear"
            />
          </image>
        </svg>
      </div>

      <img
        src="/prizza/public/tri-detail.svg"
        class="tri-det"
        style="position: absolute; bottom: 355px; right: 10vw; z-index: 0"
      />
    </div>

    <div class="project-container" id="project-container">
      <div
        class="card"
        data-title="POS + Inventory"
        data-tech="C#, .NET MAUI, SQLite"
      ></div>
      <div
        class="card"
        data-title="Portfolio"
        data-tech="Html, Css, JavaScript"
      ></div>
      <div
        class="card"
        data-title="Multiplaycation"
        data-tech="Html, Css, JavaScript"
      ></div>
      <div
        class="card"
        data-title="Filmstack"
        data-tech="React, Tailwind"
      ></div>
      <div
        class="card"
        data-title="Anonmsg"
        data-tech="Html, Css, JavaScript"
      ></div>
      <div
        class="card"
        data-title="Prizzabooth"
        data-tech="React, Tailwind"
      ></div>

      <div class="card" data-title="AI Agent" data-tech="n8n "></div>
      <img
        src="/prizza/public/hexa-det.svg"
        style="position: absolute; top: 15px; right: 3vw"
        class="hexa-det"
      />

      <img
        src="/prizza/public/tri-detail.svg"
        style="
          z-index: 0;
          bottom: 250px;
          left: 5vw;
          position: absolute;
          rotate: -30deg;
        "
      />
    </div>
    <script src="script.js"></script>
  </body>
</html>
